  <div class="fig-body">
    <svg id="it-blk-svg" class="pt" viewBox="0 0 720 280" role="img" aria-label="Bits per source symbol of an optimal block code, for block lengths 1 to 10, falling towards the entropy and staying below the bound H plus 1 over n."></svg>
    <div class="controls">
      <label class="grow" for="it-blk-p">P(1) <input type="range" id="it-blk-p" min="0.01" max="0.5" step="0.01" value="0.1"> <output id="it-blk-pv"></output></label>

  <figcaption><span class="figtag">Figure 3.1</span>Why block codes approach the entropy. For a biased coin, the dots are the expected number of bits per flip of a Huffman code applied to blocks of \(n\) flips (computed exactly), for \(n=1,\dots,10\). They lie between \(H(p)\) and \(H(p)+\frac1n\) (the shaded band), so they must approach \(H(p)\). With a very biased coin a code for single flips wastes almost a whole bit per flip.</figcaption>
