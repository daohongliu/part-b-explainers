<figure class="wide" id="fig0-1">
  <div class="fig-body">
    <svg id="it-comm-svg" class="pt" viewBox="0 0 720 210" role="img" aria-label="A message flows from a source through an encoder, a noisy channel and a decoder to its destination. The first half of the course is about the encoder that compresses, the second about protecting against the noise."></svg>
    <div class="controls">
      <label class="grow" for="it-comm-f">noise <input type="range" id="it-comm-f" min="0" max="0.3" step="0.01" value="0.08"> <output id="it-comm-fv"></output></label>
      <button type="button" id="it-comm-go">send again</button>
    </div>
    <div class="readout" id="it-comm-out" aria-live="polite"></div>
  </div>
  <figcaption><span class="figtag">Figure 0.1</span>Shannon’s picture of communication. A source produces a message; a <em>source encoder</em> squeezes it into as few bits as possible (Chapters 1 to 3); a <em>channel encoder</em> adds redundancy so the bits survive a noisy channel that flips each one with some probability (Chapters 4 and 5); decoders undo both. Here the message is sent with no protection at all, so every flipped bit garbles the text. Raise the noise and watch.</figcaption>
</figure>
