  <figcaption><span class="figtag">Figure 2.1</span>The Kraft budget. Choose a codeword length for each symbol with the − and + buttons. The bar shows how much of the unit budget \(\sum_x2^{-l_x}\) is spent: a length-\(l\) codeword costs \(2^{-l}\). While the total is at most 1, the construction of Theorem 2.5 (cut \([0,1)\) into pieces of length \(2^{-l_1},2^{-l_2},\dots\), shortest first, and read off the left ends in binary) gives a prefix code, drawn as a tree. Over budget, no uniquely decodable code exists.</figcaption>
