  <figcaption><span class="figtag">Figure 3.3</span>Arithmetic coding as repeated zooming. Each row shows the current interval, cut in proportion to \(\PP(a)=0.6\), \(\PP(b)=0.3\), \(\PP(c)=0.1\); the next symbol of the message picks out its piece, which becomes the next row. The final interval has length \(\prod_i p(x_i)\), and the code is enough binary digits of its midpoint to identify it: \(\lceil-\log_2\prod_ip(x_i)\rceil+1\) bits (Theorem 3.12). Type a message made of a, b and c.</figcaption>
