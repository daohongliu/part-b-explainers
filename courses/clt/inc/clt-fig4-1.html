  <figcaption><span class="figtag">Figure 4.1</span>AdaBoost with decision stumps, which are about the weakest learners there are: each one cuts the square once, horizontally or vertically, and predicts \(+\) on one side. Each round the stump with the smallest weighted error is chosen (dashed line). Point sizes show the weights \(D_t(i)\), so you can watch the mistakes grow. On the right, the training error of the vote \(\hat h\) and the bound \(\prod Z_{t+1}\) from (4.8). On the checkerboard no stump does better than chance once the weights balance, the weak learning assumption fails, and the bound stops falling.</figcaption>
