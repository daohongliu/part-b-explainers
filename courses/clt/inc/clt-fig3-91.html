  <figcaption><span class="figtag">Figure 3.91</span>Why \(\frac{d-1}{32\eps}\) examples are needed, with \(d=41\) and \(\eps=0.02\). The big circle is \(x_1\), carrying mass \(1-8\eps\); the forty small ones share \(8\eps\). A shattered set means every labelling of the small points is possible, so on a point it hasn’t seen the learner is right only half the time. With \(m\approx\frac{d-1}{32\eps}\approx63\) examples it typically sees only a dozen or so of the forty, and the expected error, half the mass of the unseen points, sits well above \(\eps\).</figcaption>
</figure>
