<figure class="wide" id="fig1-1">
  <div class="fig-body">
    <div class="btn-row" role="group" aria-label="Distribution of the points">
      <button type="button" data-rg-d="unif" aria-pressed="true">uniform</button>
      <button type="button" data-rg-d="blobs" aria-pressed="false">three clumps</button>
      <button type="button" data-rg-d="edge" aria-pressed="false">hugging one side</button>
    </div>
    <svg id="clt-rg-svg" class="pt" viewBox="0 0 720 380" role="img" aria-label="Points in a square labelled plus or minus by a hidden rectangle; the tightest-fit rectangle around the positive points; on the right, a histogram of errors over repeated trials."></svg>
    <div class="controls">
      <label class="grow" for="clt-rg-m">m <input type="range" id="clt-rg-m" min="1" max="300" step="1" value="40"> <output id="clt-rg-mv"></output></label>
      <label class="grow" for="clt-rg-e">ε <input type="range" id="clt-rg-e" min="0.02" max="0.3" step="0.01" value="0.1"> <output id="clt-rg-ev"></output></label>
    </div>
    <div class="controls">
      <button type="button" id="clt-rg-new">new sample</button>
      <button type="button" id="clt-rg-tgt">new hidden rectangle</button>
      <button type="button" id="clt-rg-run">run 300 trials</button>
      <label><input type="checkbox" id="clt-rg-show"> show R</label>
      <label><input type="checkbox" id="clt-rg-strips"> show strips</label>
    </div>
    <div class="readout" id="clt-rg-out" aria-live="polite"></div>
  </div>
  <figcaption><span class="figtag">Figure 1.1</span>The rectangle game. Crosses are positive, circles negative. The filled blue rectangle is the tightest fit \(R'\); the hatched red region is where it is wrong, and its mass under \(\D\) is \(\err(h_{R'})\). <em>Show strips</em> draws the four strips of the proof, each of mass \(\eps/4\), green if a sample point landed in it and red if not. <em>Run 300 trials</em> repeats the whole experiment and plots the errors: the fraction landing right of the \(\eps\) line is the failure rate, and (1.2) bounds it by \(4e^{-m\eps/4}\). Try the lopsided distribution: the strips get thin where the mass is dense.</figcaption>
</figure>
