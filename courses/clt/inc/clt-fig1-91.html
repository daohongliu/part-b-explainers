  <figcaption><span class="figtag">Figure 1.91</span>PAC learning as a game, read left to right. The order matters: the learner is fixed first, then an adversary picks the worst target \(c\) and distribution \(\D\) it can, and only then are examples drawn. The learner wins if its hypothesis errs on at most an \(\eps\) fraction of fresh examples from the same \(\D\), and it must win with probability at least \(1-\delta\) over the draws.</figcaption>
</figure>
