  <figcaption><span class="figtag">Figure 5.1</span>The concept that can’t be learned, at toy size. Top: every \(x\in\Z_N^*\) against its cube root \(f_N^{-1}(x)\). Bottom: the target concept \(f^{-1}_{N,i}\), the \(i\)th bit of the cube root (counting from the least significant), coloured cell by cell along \(x\). Even with a few hundred points the strip has no visible pattern, and at cryptographic sizes no efficient algorithm is believed to find one. The readout decodes the selected \(x\) the way the secret circuit does: repeated squaring, then a product picked out by the bits of \(d\).</figcaption>
