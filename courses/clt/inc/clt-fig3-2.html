  <figcaption><span class="figtag">Figure 3.2</span>The Sauer–Shelah lemma on a logarithmic scale. Grey: \(2^m\), all dichotomies. Teal: \(\Phi(m,d)\), the most a class of VC dimension \(d\) can produce. Coral, dashed: the bound \((em/d)^d\). Up to \(m=d\) the teal curve follows \(2^m\); after that it bends away and grows only like a polynomial of degree \(d\), which is why a union bound over dichotomies costs a factor of \(d\log m\) rather than \(m\).</figcaption>
