# Symbol (TeX, using the course macros), meaning, and the id of the item where it is introduced.
- { tex: '\Pow(\Omega)', meaning: 'the power set of $\Omega$, the set of all subsets', defined: ch1-def-algebra }
- { tex: 'A\comp', meaning: 'the complement $\Omega \setminus A$ (upright c, as in the notes)', defined: ch1-def-algebra }
- { tex: '\A', meaning: 'an algebra, or a general collection of subsets', defined: ch1-def-algebra }
- { tex: '\F', meaning: 'a $\sigma$-algebra', defined: ch1-def-algebra }
- { tex: '\mu', meaning: 'a set function or measure', defined: ch1-def-set-function }
- { tex: '(\Omega, \F, \mu)', meaning: 'a measure space', defined: ch1-def-measure-space }
- { tex: '\P', meaning: 'a probability measure', defined: ch1-def-measure-space }
- { tex: 'F_n \uparrow F,\ G_n \downarrow G', meaning: 'increasing and decreasing sequences of sets with union $F$, intersection $G$', defined: ch1-not-monotone }
- { tex: '\bar\mu', meaning: 'a mass function on a countable set', defined: ch1-ex-discrete }
- { tex: '\sigma(\A)', meaning: 'the $\sigma$-algebra generated by $\A$', defined: ch1-def-generated }
- { tex: '\B(\Omega)', meaning: 'the Borel $\sigma$-algebra of a topological space', defined: ch1-def-borel }
- { tex: '\T', meaning: 'a topology (the collection of open sets)', defined: ch1-def-borel }
- { tex: '\I', meaning: 'a $\pi$-system', defined: ch1-def-pi-system }
- { tex: '\pi(\R)', meaning: 'the $\pi$-system $\{(-\infty, x] : x \in \R\}$', defined: ch1-ex-pi-r }
- { tex: '\mu^*', meaning: 'outer measure (in the non-examinable Carathéodory sketch)', defined: ch1-thm-caratheodory }
- { tex: '\MLeb', meaning: 'the Lebesgue-measurable sets from Part A', defined: ch1-rem-mleb }
- { tex: 'F', meaning: 'the distribution function $F(x) = \mu((-\infty, x])$', defined: ch1-def-distribution-function }
- { tex: 'F(x-)', meaning: 'the left limit $\lim_{y \uparrow x} F(y)$', defined: ch1-def-distribution-function }
- { tex: '\mu_F', meaning: 'the Borel probability measure with distribution function $F$', defined: ch1-thm-lebesgue }
- { tex: 'I_{a,b}', meaning: 'the interval $(a, b]$, or $(a, \infty)$ when $b = \infty$', defined: ch1-thm-lebesgue }
