  <figcaption><span class="figtag">Figure 1.7</span>List the rationals in \([0,1]\) as \(0,1,\frac12,\frac13,\frac23,\frac14,\dots\) and cover the \(j\)-th by an interval of length \(\eps/2^j\). However many you cover, the lengths add to less than \(\eps\), so Lebesgue outer measure gives \(\mu^*(\Q\cap[0,1])=0\). With finitely many intervals you can never finish: a finite union of intervals containing every rational in \([0,1]\) contains all of \([0,1]\) except finitely many points, so its length is at least 1.</figcaption>
</figure>
