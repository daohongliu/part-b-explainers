<figure class="wide" id="fig4-2">
  <div class="fig-body">
    <svg id="dy-svg" class="pt" viewBox="0 0 720 300" role="img" aria-label="A random variable X on the unit interval and its conditional expectation given the dyadic intervals of level n, a step function."></svg>
    <div class="controls">
      <label class="grow" for="dy-n">information level n <input type="range" id="dy-n" min="0" max="8" step="1" value="2"> <output id="dy-nv"></output></label>
      <label class="grow" for="dy-k">tower: then average at level <input type="range" id="dy-k" min="-1" max="8" step="1" value="-1"> <output id="dy-kv"></output></label>
    </div>
    <div class="readout" id="dy-out" aria-live="polite"></div>
  </div>
  <figcaption><span class="figtag">Figure 4.2</span>\(\Omega=[0,1]\) with Lebesgue measure, and \(\G_n\) generated by the \(2^n\) dyadic intervals of length \(2^{-n}\). Knowing \(\G_n\) means knowing \(\omega\) to \(n\) binary digits, and \(\E[X\mid\G_n]\) (blue) is the average of \(X\) over the interval you’re told. More information, finer guess: as \(n\) grows the guess converges to \(X\), a first glimpse of the martingale convergence theorem. Use the second slider to average the blue guess again at a coarser level \(k\): you get \(\E[X\mid\G_k]\) directly, which is the tower property.</figcaption>
</figure>
