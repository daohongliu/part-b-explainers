  <figcaption><span class="figtag">Figure 3.2</span>The moving blip of Example 3.9. Drag \(\omega\) anywhere: the barcode below records \(X_k(\omega)\) for \(k\le n\), and every pass across \([0,1]\) leaves exactly one black bar, so \(X_n(\omega)=1\) infinitely often. Yet the blip’s width, which is \(\PP[X_n\ne0]\), shrinks to 0. Switch to the subsequence \(n=2^j\): only the leftmost blip of each pass remains, and every \(\omega>0\) is eventually left alone.</figcaption>
