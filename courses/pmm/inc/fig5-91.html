  <figcaption><span class="figtag">Figure 5.91</span>Three coin tosses. Row \(n\) shows what is known at time \(n\): outcomes in the same box agree on the first \(n\) tosses, and the boxes are the atoms of \(\F_n\). The shaded cells are \(\{\tau=n\}\). \(\tau\) is a stopping time exactly when, in every row, the shading never cuts a box in two: at time \(n\) you can tell from what you have seen whether to stop. "Last tail" fails, because deciding it needs the future.</figcaption>
