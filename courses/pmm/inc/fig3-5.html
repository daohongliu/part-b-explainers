  <figcaption><span class="figtag">Figure 3.5</span>On \(\Omega=\{1,2\}\) with probability \(\frac12\) each, a random variable is a point \(X=(x_1,x_2)\) and \(\|X\|_p=\big(\frac{|x_1|^p+|x_2|^p}2\big)^{1/p}\). Left: the unit balls \(\{\|X\|_p\le1\}\) for \(p=1,2,4,\infty\) and the chosen \(p\); they shrink as \(p\) grows, which is Lemma 3.19. Drag \(X\). Right: \(p\mapsto\|X\|_p\) is increasing. For \(p<1\) the “ball” stops being convex, which is why \(\|\cdot\|_p\) is only a norm for \(p\ge1\).</figcaption>
