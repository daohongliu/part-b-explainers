      <label class="grow" for="pj-2">X(2) <input type="range" id="pj-2" min="-1.5" max="2" step="0.05" value="-0.6"> <output id="pj-2v"></output></label>

  <figcaption><span class="figtag">Figure 4.3</span>Take \(\Omega=\{1,2,3\}\), each point with probability \(\frac13\). A random variable is a vector \((X(1),X(2),X(3))\in\R^3\), and \(\langle X,Y\rangle=\E[XY]\) is a rescaled dot product. With \(\G=\sigma(\{1,2\})\), the \(\G\)-measurable random variables are those with \(Y(1)=Y(2)\): a plane \(K\). The conditional expectation \(\E[X\mid\G]\) is the foot of the perpendicular from \(X\) to that plane, and the error \(X-\E[X\mid\G]\) (red) is orthogonal to everything in it.</figcaption>
</figure>
