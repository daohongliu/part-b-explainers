  <figcaption><span class="figtag">Figure 1.9</span>Two functions with the same jump at 0, differing only in the value they take there. Each defines a set function \(\mu_0((a,b])=G(b)-G(a)\). The sets \(A_n=(0,\frac1n]\) decrease to \(\emptyset\). With the right continuous choice \(\mu_0(A_n)\to0\). With the other, \(\mu_0(A_n)\to0.4\): that mass is parked at \(0^+\), an address with no house, and countable additivity fails.</figcaption>
