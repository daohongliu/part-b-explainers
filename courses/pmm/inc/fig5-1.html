  <figcaption><span class="figtag">Figure 5.1</span>Five fair coin tosses; \(S_n\) = (heads) − (tails) after \(n\) tosses, and \(\F_n\) is generated by the first \(n\) tosses. Each node of the tree at depth \(n\) is an atom of \(\F_n\): everything you could know at time \(n\). A random time \(\tau\) is a stopping time exactly when, at every node, either every path through it stops there or none does. Ochre nodes are where all paths through them stop; a red ring means some paths through that node stop there and others don’t, so the decision needed information from the future. Click a leaf to follow one path.</figcaption>
