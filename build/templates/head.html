.tile .g4 { display: grid; grid-template-columns: repeat(2, 8px); gap: 2px; }

@media (max-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tabs { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .6rem; }
.step-text { font-size: 1rem; line-height: 1.5; margin-top: .6rem; min-height: 3em; }
.step-text p { margin: 0 0 .4rem; }

details.pause { margin: 1.3rem 0 1.6rem; padding: .55rem .9rem .55rem 1rem; border: 1.2px dashed var(--ink-soft); border-radius: 4px 14px 5px 12px / 12px 5px 14px 4px; }

  content: "?"; display: inline-grid; place-items: center; width: 1.35rem; height: 1.35rem; margin-right: .55rem;

}

.specimens { list-style: none; padding: 0 !important; display: grid; gap: .45rem; }

  content: counter(s); position: absolute; left: 0; top: .1rem; width: 1.4rem; height: 1.4rem; display: grid; place-items: center;

}

.tablewrap { overflow-x: auto; }

/* chapter end nav and contents */
.ch-nav { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 3.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); max-width: 100% !important; }

.toc .num { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: 1.6rem; color: var(--blue); }

.howto { font-size: 1.05rem; }
.walk-strip { width: 100%; height: 120px; display: block; margin: .5rem 0 1.5rem; max-width: 100% !important; }

footer.colophon { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .9rem; color: var(--ink-soft); max-width: var(--col); }

.tiny { font-size: .75rem; opacity: .8; }
.nw { white-space: nowrap; }
mjx-container.mj-wide:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }

@media (max-width: 640px) {
  body { font-size: 1.1rem; }

  .pills { justify-content: flex-start; }
  .hero-labels { gap: .5rem; }

  .hero-labels b { font-size: 1.05rem; }

}

  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ===== multi-course chrome ===== */
.pillgroup { display: none; gap: .25rem; }

.tools { display: flex; gap: .3rem; }
.tool-btn { font-size: .76rem; background: none; color: var(--ink-soft); border: 1px solid var(--rule); padding: .18rem .55rem; cursor: pointer;
  border-radius: 255px 12px 225px 12px / 12px 225px 12px 255px; }

/* hub */
.hub-list { list-style: none; padding: 0 !important; margin: 2rem 0 2.5rem; display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); max-width: 52rem !important; }

:root[data-theme="dark"] .hub-card[data-course="pmm"] .hc-t { color: #95b1dc; } :root[data-theme="dark"] .hub-card[data-course="clt"] .hc-t { color: #86c7bb; }

.hc-m { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: .72rem; color: var(--ink-soft); margin-top: .3rem; }

/* estimates */
.sec-meta, .ch-meta, .cmeta { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" .6; font-size: .72rem; color: var(--ink-soft); letter-spacing: .01em; }

.ch-meta { margin: .2rem 0 0; }
.cmeta { margin-top: .15rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.rd { display: inline-block; width: 4rem; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; vertical-align: middle; }
.rd i { display: block; height: 100%; background: var(--blue); width: 0; }
.sheet-list { list-style: none; padding: 0 !important; columns: 2 14rem; }

/* exercises */
details.pause.ex summary .exname { font-style: italic; }

  border-bottom: 1px dotted var(--ochre); }

/* problem sheets */
.sheet-prompt { display: flex; gap: .7rem; align-items: baseline; margin: 1.6rem 0; padding: .6rem .9rem; font-size: 1.02rem; font-style: italic;
  background: linear-gradient(transparent 0 calc(100% - 2px), var(--ochre-wash) calc(100% - 2px)); border-left: 2px solid var(--ochre); }

.sq { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: .2rem .8rem; margin: 1.8rem 0; padding-top: .9rem; border-top: 1px dashed var(--rule); }
.sq-n { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: 1.35rem; color: var(--blue); line-height: 1.2; }
.sq-b > *:first-child { margin-top: 0; }
.sq-t { font-family: var(--sc); letter-spacing: .04em; font-size: .95rem; color: var(--ink-soft); margin: .1rem 0 .3rem; }
.sq-b ol[type="a"], .sq-b ol.parts { list-style: lower-alpha; padding-left: 1.6rem; }
.sq-b ol.parts > li { margin-bottom: .45rem; }
.sq .hint { font-size: .98rem; }
.sq .uses { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" .6; font-size: .72rem; color: var(--ink-soft); margin-top: .35rem; }

/* reading bar + left contents */
.readbar { position: fixed; z-index: 21; left: 0; right: 0; top: calc(var(--topbar-h, 2.6rem) + env(safe-area-inset-top, 0px)); height: 2px; pointer-events: none; }
.readbar i { display: block; height: 100%; width: 0; background: var(--blue); opacity: .55; transition: width .12s linear; }
.toc-side { position: fixed; z-index: 30; display: none; top: calc(4rem + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 14.5rem; max-height: calc(100vh - 5.5rem); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; font-size: .84rem; line-height: 1.32; padding-bottom: 1rem; }
.toc-head { position: sticky; top: 0; background: var(--paper); padding: .2rem 0 .55rem; z-index: 1; }

.toc-meta { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" .6; font-size: .68rem; color: var(--ink-soft); margin: .25rem 0 .35rem; }
.toc-prog { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }

.toc-l, .tl-sub { list-style: none; margin: 0; padding: 0; }
.toc-l { border-left: 1px solid var(--rule); margin-top: .3rem; }
.toc-l a { display: flex; gap: .4rem; align-items: baseline; padding: .2rem .5rem; margin-left: -1px; border-left: 2px solid transparent; color: var(--ink-soft); text-decoration: none; }
.toc-l a:hover { color: var(--ink); background: var(--blue-wash); }
.tl-sec > a .tl-n { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: .7rem; flex: none; min-width: 1.7rem; }

.tl-sec > a .tl-m { font-family: var(--mono); font-size: .64rem; opacity: .7; flex: none; }
.tl-sec.done > a { color: color-mix(in srgb, var(--ink-soft) 75%, transparent); }

.tl-sub { display: none; margin: .05rem 0 .35rem; }
.tl-sec.cur > .tl-sub { display: block; }

.tl-k { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: .66rem; flex: none; }

.toc-foot { margin-top: .7rem; font-size: .76rem; } .toc-foot a { color: var(--ink-soft); text-decoration: none; } .toc-foot a:hover { color: var(--blue); }
.toc-btn { position: fixed; z-index: 40; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--paper); color: var(--ink); border: 1.3px solid var(--ink-soft); padding: .35rem .7rem; font-size: .8rem; cursor: pointer;
  border-radius: 255px 12px 225px 12px / 12px 225px 12px 255px; box-shadow: 3px 4px 0 var(--dot); }
.toc-side.open { display: block; top: auto; left: auto; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  width: min(21rem, calc(100vw - 32px)); max-height: 70vh; background: var(--paper); border: 1.3px solid var(--ink-soft); padding: 0 .8rem .6rem;
  border-radius: 3px 14px 4px 12px / 12px 4px 14px 3px; box-shadow: 4px 5px 0 var(--dot); }
.toc-side.open .toc-head { padding-top: .7rem; }
@media (min-width: 1300px) {
  .toc-side { display: block; }
  .toc-side.open { position: fixed; top: calc(4rem + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: auto; bottom: auto; width: var(--tocw); max-height: calc(100vh - 5.5rem); border: 0; box-shadow: none; padding: 0; background: none; }
  .toc-btn { display: none; }

  :root { --tocw: 17.5rem; --mmw: 4.75rem; --gut: 6.2rem; --snw: 13rem; --sng: 2.6rem;
          --avail: calc(100vw - var(--tocw) - 1.6rem - var(--mmw));
          --col: clamp(36rem, calc(var(--avail) - var(--gut) - var(--snw) - var(--sng) - 1rem), 50rem);
          --pml: calc(var(--tocw) + 1.6rem + max(0px, (var(--avail) - var(--pw)) / 2)); }
  .toc-side { width: var(--tocw); }
  body.has-toc .page { margin-left: var(--pml); }
  body.has-toc .toc-side { left: max(10px, calc(var(--pml) - var(--tocw) - 1.2rem)); }
}

.side-panel, .notes-drawer { position: fixed; z-index: 55; right: 0; top: calc(var(--topbar-h, 2.6rem) + env(safe-area-inset-top, 0px)); bottom: 0; width: min(30rem, 92vw);

  padding: 0 1.1rem 2rem; font-size: 1rem; line-height: 1.5; }
.notes-drawer { z-index: 56; }

@media (min-width: 1300px) { body.side-open .page { margin-right: min(30rem, 40vw); margin-left: calc(var(--tocw) + 1.6rem); } body.side-open .sidenote { display: none; } body.side-open .view figure.wide { max-width: var(--col); } }
.nd-where { font-size: .88rem; color: var(--ink-soft); font-style: italic; margin: .6rem 0 .4rem; }
.nd-empty { font-size: .95rem; color: var(--ink-soft); }
.nd-g { font-family: var(--sc); letter-spacing: .05em; font-size: .85rem; color: var(--ink-soft); margin: 1.1rem 0 .3rem; }
.nd-it { padding: .45rem 0 .6rem; border-bottom: 1px dotted var(--rule); }
.nd-q { font-size: .92rem; color: var(--ink-soft); border-left: 2px solid var(--ochre); padding-left: .6rem; }
.nd-x { white-space: pre-wrap; margin-top: .3rem; }
.nd-row { display: flex; justify-content: space-between; gap: 1rem; font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" .6; font-size: .68rem; color: var(--ink-soft); margin-top: .3rem; }
.nd-row a { text-decoration: none; }
.nd-foot { display: flex; gap: .5rem; margin-top: 1.2rem; }
.nd-foot button, .note-pop button { font-size: .74rem; background: none; border: 1px solid var(--rule); color: var(--ink); padding: .2rem .6rem; cursor: pointer; border-radius: 255px 12px 225px 12px / 12px 225px 12px 255px; }
.nd-foot button:hover, .note-pop button:hover { border-color: var(--ink-soft); }
.note-fab { position: fixed; z-index: 58; font-size: .76rem; background: var(--ink); color: var(--paper); border: 0; padding: .3rem .65rem; cursor: pointer;
  border-radius: 255px 12px 225px 12px / 12px 225px 12px 255px; box-shadow: 2px 3px 0 var(--dot); }

  border-radius: 3px 14px 4px 12px / 12px 4px 14px 3px; box-shadow: 4px 5px 0 var(--dot); padding: .7rem .8rem .6rem; font-size: .95rem; }

.note-pop textarea { width: 100%; font: inherit; font-size: .98rem; color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 3px; padding: .45rem .55rem; resize: vertical; }
.note-pop textarea:focus { outline: 1.5px solid var(--blue); outline-offset: 0; }
.np-row { display: flex; justify-content: space-between; align-items: center; margin-top: .45rem; gap: .5rem; }
.np-where { font-family: var(--mono); font-size: .66rem; color: var(--ink-soft); }
.np-b { display: flex; gap: .35rem; } .note-pop .np-save { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.note-pop .np-del { color: var(--red); }
mark.unote { background: linear-gradient(transparent 0 58%, var(--ochre-wash) 58%); color: inherit; cursor: pointer; border-radius: 1px; }
.unote-m { background: linear-gradient(transparent 0 70%, var(--ochre-wash) 70%); cursor: pointer; }

@keyframes flashn { 0%, 30% { background: var(--ochre-wash); } 100% { background: transparent; } }
.toast { position: fixed; z-index: 70; left: 50%; bottom: 1.4rem; transform: translate(-50%, 10px); opacity: 0; transition: opacity .25s, transform .25s;
  background: var(--ink); color: var(--paper); padding: .45rem .9rem; border-radius: 4px; font-size: .9rem; max-width: calc(100vw - 32px); }

@media (max-width: 640px) { .tool-btn { padding: .15rem .45rem; } .topbar-in { flex-wrap: nowrap; gap: .4rem; } .pills { flex: 1 1 auto; } .tools { flex: none; } }


/* algorithms */
.algo { margin: 1.6rem 0; padding: .7rem 1rem .6rem; border: 1.2px solid var(--ink-soft); border-radius: 3px 12px 4px 10px / 10px 4px 12px 3px; background: var(--paper-2); font-size: 1.02rem; }
.algo-h { font-family: var(--sc); letter-spacing: .04em; margin-bottom: .35rem; }
.algo-k { font-weight: 700; margin-right: .4rem; }
.algo-l { list-style: none; counter-reset: al; padding: 0 !important; margin: 0; }
.algo-l li { counter-increment: al; position: relative; padding-left: 2rem; line-height: 1.55; }
.algo-l li::before { content: counter(al); position: absolute; left: 0; width: 1.3rem; text-align: right; font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: .7rem; color: var(--ink-soft); top: .3em; }
.algo-l li.in1 { padding-left: 3.4rem; } .algo-l li.in2 { padding-left: 4.8rem; } .algo-l li.in3 { padding-left: 6.2rem; }
.algo-c { font-style: italic; color: var(--ink-soft); font-size: .9em; margin-left: .5rem; }
.algo-c::before { content: "▹ "; font-style: normal; }
@media (max-width: 640px) { .algo-l li.in1 { padding-left: 2.8rem; } .algo-l li.in2 { padding-left: 3.6rem; } .algo-l li.in3 { padding-left: 4.4rem; } }
.ov { text-decoration: overline; text-decoration-thickness: 1px; }
/* CLT figure parts */
.cj-target, .cj-lits { font-size: 1.05rem; margin-bottom: .55rem; display: flex; flex-wrap: wrap; gap: .3rem .35rem; align-items: baseline; }
.cj-lab { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: .72rem; color: var(--ink-soft); margin-right: .4rem; }
.cj-l { display: inline-block; min-width: 2.2rem; text-align: center; padding: .05rem .3rem; border: 1px solid var(--rule); border-radius: 8px 3px 8px 3px; transition: opacity .3s, color .3s; font-style: italic; }
.cj-l.tg { border-color: var(--blue); }
.cj-l.off { opacity: .35; text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 1.5px; }
.cj-log { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" .6; font-size: .78rem; min-height: 7.5rem; }
.cj-row { display: grid; grid-template-columns: 5.6rem 1.2rem minmax(0, 1fr); gap: .5rem; padding: .08rem 0; }
.cj-row.neg { opacity: .45; }
.cj-x { letter-spacing: .12em; } .cj-y { color: var(--blue); } .cj-row.neg .cj-y { color: var(--ochre); }
.cj-k { font-family: var(--serif); font-size: .92rem; }
.col-grid { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 1rem 1.4rem; align-items: start; }
.col-grid > svg { width: 100%; height: auto; display: block; }
.col-v { cursor: pointer; } .col-v:focus { outline: none; } .col-v:focus-visible circle { opacity: .45; }
.col-tables { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; font-size: .86rem; }
.col-terms { flex-basis: 100%; font-size: .95rem; line-height: 1.5; }
.col-t { border-collapse: collapse; } .col-t th { font-family: var(--sc); font-weight: 500; font-size: .8rem; text-align: left; color: var(--ink-soft); padding-bottom: .2rem; }
.col-t td { padding: .05rem .5rem .05rem 0; } .col-t td.mono { letter-spacing: .1em; font-size: .8rem; }
.col-t .ok { color: var(--green); } .col-t .bad { color: var(--red); }
@media (max-width: 640px) { .col-grid { grid-template-columns: minmax(0, 1fr); } .col-grid > svg { max-width: 15rem; margin: 0 auto; } }


.sh-grid { display: grid; grid-template-columns: minmax(0, 21rem) minmax(0, 1fr); gap: 1rem 1.4rem; align-items: start; margin-top: .6rem; }
.sh-grid > svg { width: 100%; height: auto; display: block; touch-action: none; }
.sh-pt { cursor: grab; } .sh-pt:active { cursor: grabbing; }
.sh-dich { display: flex; flex-wrap: wrap; gap: .3rem; align-content: flex-start; }
.sh-d { font-family: var(--mono); font-size: .8rem; padding: .12rem .35rem; letter-spacing: .05em; background: var(--paper); border: 1px solid var(--rule); }
.sh-d i { font-style: normal; } .sh-d .p { color: var(--blue); } .sh-d .n { color: var(--ochre); }
.sh-d.no { opacity: .45; text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 1.5px; }

.three-wrap { position: relative; }
.three-wrap canvas { display: block; width: 100%; cursor: grab; touch-action: none; }

@media (max-width: 640px) { .sh-grid { grid-template-columns: minmax(0, 1fr); } }

.cr-steps { line-height: 1.9; }
.cr-on { color: var(--blue); font-weight: 600; } .cr-off { opacity: .5; }

details.hint { margin: .5rem 0 .2rem; font-size: .98rem; }
details.hint > summary { cursor: pointer; list-style: none; display: inline-block; font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: .74rem; color: var(--ochre); border-bottom: 1px dotted var(--ochre); }

/* sidebar: gauges, vertical progress rail */
.toc-l { position: relative; }
.tl-sec > a { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; column-gap: .4rem; align-items: baseline; }
.tl-sec > a .tl-n { min-width: 0; }
.tl-g { grid-column: 2 / 4; display: flex; gap: .55rem; font-size: .62rem; letter-spacing: .1em; line-height: 1.2; margin-top: .05rem; opacity: .8; }
.tl-gd { color: var(--ochre); } .tl-gi { color: var(--blue); }
.tl-sec.done > a .tl-g { opacity: .45; }
.toc-rail { position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; pointer-events: none; }
.toc-rail i { position: absolute; left: 0; top: 0; width: 2px; background: var(--blue); opacity: .45; border-radius: 1px; transition: height .12s linear; }
.toc-rail b { position: absolute; left: -3px; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px var(--paper); transition: top .12s linear; }
.tl-sec.cur > a { border-left-color: transparent; }
.tl-sub li.cur > a { color: var(--ink); background: var(--blue-wash); }
.ch-meta .meter, .cmeta .meter { letter-spacing: .1em; }
.ch-meta .meter .dots, .cmeta .dots { font-size: .7rem; }
.cmeta .dd { color: var(--ochre); } .cmeta .di { color: var(--blue); }


/* ===== hierarchy: sections, subsections, results and proofs ===== */
.sec-block { margin-top: 3.4rem; padding-top: .2rem; border-top: 1px solid var(--rule); position: relative; }
.sec-block > h2 { margin-top: 1.5rem; }
.sec-block > h2:first-child::before { content: ""; position: absolute; left: 0; top: -2px; width: 3.2rem; height: 3px; background: var(--ink); border-radius: 2px; }
.sub-block { position: relative; margin: 2rem 0 1.6rem; padding-left: 1.15rem; border-left: 1px solid var(--rule); }
.sub-block > h3 { margin-top: 0; padding-top: .1rem; }
.sub-block > h3::before { content: ""; position: absolute; left: -5px; top: .55rem; width: 9px; height: 9px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink-soft); }
.sub-block .pg { left: calc(-1 * var(--gut) - 1.15rem); }

/* results get a ruled box whose colour says what kind they are */
.thm { padding: .7rem .95rem .75rem 1.05rem; border-left: 3px solid var(--blue); background: color-mix(in srgb, var(--blue-wash) 45%, transparent); border-radius: 0 10px 10px 0; }
.thm.k-def { border-left-color: var(--ochre); background: color-mix(in srgb, var(--ochre-wash) 40%, transparent); }
.thm.k-ex { border-left: 2px dashed var(--ink-soft); background: transparent; padding-top: .35rem; padding-bottom: .4rem; }
.thm .pg { left: calc(-1 * var(--gut) - 1.05rem - 3px); }
.sub-block .thm .pg { left: calc(-1 * var(--gut) - 1.15rem - 1.05rem - 3px); }
.xcard .thm, .side-ib .thm { padding: .4rem .7rem; }

/* a proof hangs off the result it proves: indented, ruled, opened by "Proof." and closed by ∎ */
.proof { margin: .1rem 0 1.8rem 1.1rem; padding: .55rem .9rem .5rem 1rem; border-left: 1.5px solid color-mix(in srgb, var(--blue) 55%, transparent); position: relative; }
.thm + .proof::before { content: ""; position: absolute; left: -1.15rem; top: -.15rem; width: 1rem; height: 1.05rem; border-left: 1.5px solid color-mix(in srgb, var(--blue) 55%, transparent); border-bottom: 1.5px solid color-mix(in srgb, var(--blue) 55%, transparent); border-bottom-left-radius: 6px; }
.thm:has(+ .proof) { margin-bottom: .1rem; }
.thm + .proof { margin-top: 0; }
.proof .phead { font-family: var(--sc); font-style: normal; font-weight: 700; letter-spacing: .03em; color: var(--blue); margin-right: .4rem; }
.proof > p + p, .proof > p + .disp, .proof > .disp + p { margin-top: .55rem; }
.proof > p:last-child { margin-bottom: .1rem; }
.proof .qed { color: var(--blue); }
.proof .phead a.xref { color: inherit; text-decoration-color: color-mix(in srgb, var(--blue) 40%, transparent); }
@media (max-width: 640px) {
  .sub-block { padding-left: .75rem; }
  .thm { padding: .6rem .7rem .65rem .8rem; }
  .proof { margin-left: .55rem; padding: .45rem .5rem .45rem .75rem; }
  .thm + .proof::before { left: -.6rem; width: .5rem; }
}


/* ===== roles: what a stretch of prose is for, labelled in the left gutter ===== */
.role { position: relative; --rc: var(--ink-soft); }
.role.r-idea, .role.r-reading { --rc: var(--blue); }
.role.r-why, .role.r-technique, .role.r-question { --rc: var(--ochre); }
.role.r-example, .role.r-payoff { --rc: var(--green); }
.role.r-caution { --rc: var(--red); }
.role.r-link, .role.r-roadmap, .role.r-recap { --rc: color-mix(in srgb, var(--blue) 50%, var(--red)); }
.role-l { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: .64rem; line-height: 1.25; color: var(--rc); letter-spacing: .02em; }
.role-k { display: block; text-transform: lowercase; font-weight: 600; }
.role-a { display: block; font-family: var(--serif); font-variation-settings: normal; font-style: italic; font-size: .78rem; color: var(--ink-soft); letter-spacing: 0; margin-top: .1rem; }
.role-a a.xref { color: inherit; }
.role-l[data-tip], .role-l[data-tip] * { text-decoration: none !important; border-bottom: 0 !important; }
.role > p:last-child { margin-bottom: 1.1rem; }
@media (min-width: 1120px) {
  .role::before { content: ""; position: absolute; left: -.85rem; top: .45rem; bottom: 1.2rem; border-left: 1.5px solid var(--rc); opacity: .55; border-radius: 1px; }
  .role-l { position: absolute; left: calc(-1 * var(--gut) + .2rem); width: calc(var(--gut) - 1.3rem); top: .35rem; text-align: right; }
  .sub-block .role-l { left: calc(-1 * var(--gut) + .2rem - 1.15rem); }
  .role-l[data-tip] { cursor: help; }
}
@media (max-width: 1119px) {
  .role { border-left: 1.5px solid color-mix(in srgb, var(--rc) 55%, transparent); padding-left: .75rem; overflow-x: clip; }
  .role-l { display: flex; flex-wrap: wrap; gap: .1rem .5rem; align-items: baseline; margin-bottom: .2rem; }
  .role-k, .role-a { display: inline; }
}
@media (max-width: 640px) { .proof .nw, .role .nw, .thm .nw, .sub-block .nw { white-space: normal; } }


/* minimap */
.minimap { display: none; position: fixed; z-index: 25; right: 10px; top: calc(var(--topbar-h, 2.6rem) + env(safe-area-inset-top, 0px) + 14px); bottom: 14px; width: calc(var(--mmw, 4.75rem) - 1.2rem); cursor: pointer; user-select: none; touch-action: none; }

.cmap { position: fixed; z-index: 24; top: calc(var(--topbar-h, 2.6rem) + env(safe-area-inset-top, 0px) + 10px); bottom: 12px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 0 4px 10px 6px; }
.cmap.floating { right: calc(var(--mmw, 4.75rem) + 4px); width: min(19rem, 40vw); bottom: auto; max-height: calc(100vh - var(--topbar-h, 2.6rem) - 40px); background: var(--paper); border: 1.3px solid var(--ink-soft); border-radius: 3px 14px 4px 12px / 12px 4px 14px 3px; box-shadow: 4px 5px 0 var(--dot); padding: 0 8px 10px; z-index: 50; }
.cmap-h { position: sticky; top: 0; background: var(--paper); display: flex; justify-content: space-between; align-items: baseline; padding: .45rem 0 .3rem; z-index: 1; }
.cmap-t { font-family: var(--sc); font-size: .78rem; letter-spacing: .05em; color: var(--ink-soft); }

.cmap-btn { position: fixed; z-index: 26; right: 10px; top: calc(var(--topbar-h, 2.6rem) + env(safe-area-inset-top, 0px) + 14px); width: calc(var(--mmw, 4.75rem) - 1.2rem); font-size: .68rem; padding: .15rem 0; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-soft); cursor: pointer; border-radius: 6px; }

.cmap-svg { display: block; overflow: visible; }
.cmap-sec { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink-soft); }
.cmap-n { cursor: pointer; outline: none; }
.cmap-n rect { fill: var(--paper); stroke: var(--rule); stroke-width: 1; transition: fill .15s, stroke .15s; }
.cmap-n text { font-family: var(--serif); font-size: 11px; fill: var(--ink); }
.cmap-n.hub rect { fill: color-mix(in srgb, var(--blue-wash) 70%, var(--paper)); stroke: color-mix(in srgb, var(--blue) 45%, transparent); }
.cmap-n.hub text { font-weight: 600; }

.cmap-n.ext text { fill: var(--ink-soft); font-style: italic; }
.cmap-n text.cmap-ch { font-family: var(--mono); font-style: normal; font-size: 8px; fill: var(--ochre); }
.cmap-n.cur rect { stroke: var(--blue); stroke-width: 2; }
.cmap-n:hover rect, .cmap-n:focus-visible rect { stroke: var(--ink); }
.cmap-tree { fill: none; stroke: var(--rule); stroke-width: 1; }
.cmap-e { fill: none; stroke: var(--ink-soft); stroke-width: 1; opacity: .35; transition: opacity .15s, stroke .15s; }
.cmap-e.x { stroke-dasharray: 2 2.5; stroke: var(--ochre); }

.cmap-ah.x { stroke: var(--ochre); }
.cmap-el { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 1; font-size: 8.5px; fill: var(--ink); opacity: 0; transition: opacity .15s; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
.focus .cmap-e:not(.on), .focus .cmap-ah:not(.on) { opacity: .1; }
.cmap-e.on, .cmap-ah.on { opacity: 1; stroke-width: 1.6; stroke: var(--blue); }
.cmap-e.x.on, .cmap-ah.x.on { stroke: var(--ochre); }

.focus .cmap-n:not(.near) { opacity: .45; }

/* search */
.search-back { position: fixed; inset: 0; z-index: 80; background: color-mix(in srgb, var(--ink) 18%, transparent); }
.search-box { position: fixed; z-index: 81; left: 50%; top: 9vh; transform: translateX(-50%); width: min(44rem, calc(100vw - 24px)); max-height: 78vh; display: flex; flex-direction: column;
  background: var(--paper); border: 1.3px solid var(--ink-soft); border-radius: 3px 14px 4px 12px / 12px 4px 14px 3px; box-shadow: 5px 6px 0 var(--dot); }
.sb-in { display: flex; gap: .5rem; align-items: center; padding: .7rem .8rem .55rem; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.sb-in input { flex: 1 1 16rem; font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 4px; padding: .45rem .6rem; }
.sb-in input:focus { outline: 1.5px solid var(--blue); }
.sb-filt { display: flex; gap: .25rem; } .sb-filt button { font-size: .72rem; padding: .2rem .5rem; }

.sb-r { padding: .45rem .6rem .5rem; border-radius: 6px; cursor: pointer; }
.sb-r.on, .sb-r:hover { background: var(--blue-wash); }

.sb-kind { text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--ink-soft); }
.sb-kind.k-result { color: var(--blue); } .sb-kind.k-figure, .sb-kind.k-exercise, .sb-kind.k-question { color: var(--ochre); } .sb-kind.k-section { color: var(--ink); }
.sb-t { font-size: 1rem; margin-top: .1rem; }
.sb-s { font-size: .86rem; color: var(--ink-soft); line-height: 1.4; margin-top: .1rem; }
.sb-r mark { background: var(--ochre-wash); color: inherit; border-radius: 2px; padding: 0 1px; }

.sb-foot { font-family: var(--mono); font-size: .64rem; color: var(--ink-soft); padding: .35rem .8rem .5rem; border-top: 1px solid var(--rule); }

/* ===== course variations ===== */
/* Learning Theory: a cooler, greener paper, teal ink, coral accents, dotted rather than squared figure paper, and a mono display face for chapter titles. */
body[data-course="clt"] {
  --paper: #eef0e9; --paper-2: #e2e6dc; --ink: #1f2420; --ink-soft: #5b6359; --rule: #c4cbbd;
  --blue: #23675f; --blue-wash: rgba(35, 103, 95, .12); --ochre: #b5583a; --ochre-wash: rgba(201, 107, 74, .22);
  --red: #9b3446; --red-wash: rgba(155, 52, 70, .12); --green: #4f7a2e; --dot: rgba(31, 36, 32, .13);
}
