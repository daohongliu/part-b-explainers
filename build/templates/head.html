/* Layout: a book column (~37rem) with a right margin for sidenotes; one chapter on screen at a time,

:root {
  --paper: #f1ece1;
  --paper-2: #e8e1d2;
  --ink: #26221c;
  --ink-soft: #675f52;
  --rule: #cec4af;
  --blue: #2c4d78;
  --blue-wash: rgba(44, 77, 120, .13);
